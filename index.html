<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f9f8f0" />
  <meta name="description" content="Asia 2026 trip roadmap — Vietnam, Chongqing, Zhangjiajie, Shanghai, Beijing route planner with interactive maps and Apple Maps links." />
  <title>Asia 2026 Roadmap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <strong>Asia 2026</strong>
        <span>Vietnam + China route map · stop research integrated · Apple Maps links</span>
      </div>
      <nav class="tabs" id="tabs" aria-label="Trip sections"></nav>
      <div class="planner-tools" aria-label="Itinerary tools">
        <label class="search-wrap" for="tripSearch">
          <span>Search stops</span>
          <input id="tripSearch" type="search" placeholder="Try “museum”, “HSR”, “rain”, “hotpot”…" autocomplete="off" />
        </label>
        <button class="tool-toggle" type="button" id="detailToggle" aria-pressed="false">Compact details</button>
      </div>
    </div>
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="title"></h1>
        </div>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="map-wrap">
        <div id="map"></div>
        <div class="map-badge">
          <span id="mapNote">Planning map; verify exact branches, POIs, and live routing in Apple Maps/Amap/Dianping.</span>
        </div>
      </div>
      <div class="content" id="content"></div>
    </section>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
