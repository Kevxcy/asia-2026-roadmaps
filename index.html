:root {
  --bg:#191611; --bg2:#211d17; --paper:#EFE6D6; --paper2:#E4D5BD; --ink:#2B2118; --muted:#766A5C;
  --night:#151210; --night2:#211B16; --line:rgba(239,230,214,.16); --line-dark:rgba(43,33,24,.14);
  --accent:#C96F42; --gold:#D6A85A; --sage:#7A8F6A; --lav:#9D7EBA; --blue:#8EA4B8;
  --radius:28px; --shadow:0 24px 80px rgba(0,0,0,.28);
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--night); }
body { margin:0; color:var(--paper); background:
  radial-gradient(circle at 18% -8%, rgba(201,111,66,.25), transparent 36%),
  radial-gradient(circle at 100% 0%, rgba(157,126,186,.14), transparent 28%),
  linear-gradient(180deg,#16130f 0%,#211d17 55%,#16130f 100%);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Segoe UI, sans-serif; -webkit-font-smoothing:antialiased; }
a,button { -webkit-tap-highlight-color:rgba(201,111,66,.22); }
button { font:inherit; color:inherit; }
.shell { max-width:1440px; margin:0 auto; padding:12px max(12px,env(safe-area-inset-left)) calc(48px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right)); }
.topbar { position:sticky; top:0; z-index:900; padding:10px 0 12px; background:linear-gradient(180deg,rgba(21,18,16,.98) 72%,rgba(21,18,16,0)); backdrop-filter:blur(14px); }
.brand { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 2px 10px; }
.brand strong { font-family:ui-serif, Georgia, "Times New Roman", serif; font-size:20px; letter-spacing:-.025em; font-weight:520; color:#fff7ea; }
.brand span { color:#b7aa99; font-size:12px; line-height:1.2; text-align:right; }
.tabs { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
.tab { min-height:46px; border-radius:999px; border:1px solid var(--line); background:rgba(239,230,214,.055); color:#EDE1CE; font-weight:850; font-size:12px; letter-spacing:-.01em; box-shadow:inset 0 1px 0 rgba(255,255,255,.04); }
.tab[aria-selected="true"] { color:#231911; background:linear-gradient(180deg,#F0DFBF,#CFA467); border-color:rgba(255,238,199,.72); box-shadow:0 14px 36px rgba(0,0,0,.22); }
.panel { overflow:hidden; border:1px solid var(--line); border-radius:var(--radius); background:linear-gradient(180deg,rgba(239,230,214,.10),rgba(239,230,214,.045)); box-shadow:var(--shadow); }
.panel-head { padding:18px 16px; display:grid; gap:8px; border-bottom:1px solid var(--line); }
.eyebrow { color:var(--gold); text-transform:uppercase; letter-spacing:.16em; font-size:10px; font-weight:950; }
h1 { margin:0; font-family:ui-serif, Georgia, "Times New Roman", serif; font-size:clamp(34px,8vw,76px); line-height:.92; letter-spacing:-.055em; font-weight:520; color:#fff8eb; }
.sub { color:#bdb09e; line-height:1.45; font-size:14px; max-width:900px; }
.map-wrap { position:relative; background:#171717; border-bottom:1px solid var(--line); }
#map { width:100%; height:58vh; min-height:430px; max-height:720px; background:#171717; touch-action:pan-x pan-y; }
.map-badge { position:absolute; left:12px; right:12px; bottom:12px; z-index:650; pointer-events:none; display:flex; justify-content:center; }
.map-badge span { padding:8px 12px; border-radius:999px; background:rgba(21,18,16,.78); color:#d7c9b7; border:1px solid rgba(239,230,214,.16); font-size:11px; line-height:1.25; backdrop-filter:blur(10px); }
.content { padding:14px; display:grid; gap:14px; }
.hotel,.overview-card,.leg-card { border:1px solid var(--line); border-radius:22px; padding:14px; background:rgba(239,230,214,.07); }
.hotel { border-color:rgba(214,168,90,.38); background:linear-gradient(180deg,rgba(214,168,90,.14),rgba(214,168,90,.045)); }
.label { color:#E0B96F; text-transform:uppercase; letter-spacing:.14em; font-weight:950; font-size:10px; }
.hotel strong,.overview-card strong,.leg-card strong { display:block; margin-top:6px; font-size:15px; line-height:1.3; color:#fff7e8; }
.hotel small,.overview-card span,.leg-card span { display:block; margin-top:5px; color:#bfb3a4; line-height:1.45; font-size:12px; }
.grid { display:grid; gap:12px; }
.overview-grid { display:grid; gap:12px; }
.legs { display:grid; gap:10px; }
.leg-card { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; }
.mode { min-width:76px; text-align:center; border-radius:999px; padding:7px 9px; background:rgba(201,111,66,.18); color:#ffd6bf; border:1px solid rgba(201,111,66,.35); font-size:11px; font-weight:950; }
.day { border:1px solid var(--line); border-radius:22px; overflow:hidden; background:rgba(239,230,214,.045); }
.day-head { padding:13px 14px; border-bottom:1px solid rgba(239,230,214,.10); display:flex; justify-content:space-between; gap:10px; align-items:center; }
.day-title { display:flex; align-items:center; gap:9px; font-weight:950; font-size:13px; line-height:1.25; }
.swatch { width:10px; height:10px; border-radius:999px; box-shadow:0 0 0 4px rgba(239,230,214,.07); flex:0 0 auto; }
.route-links { display:flex; gap:8px; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid rgba(239,230,214,.08); }
.action { min-height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:14px; padding:10px 12px; text-decoration:none!important; font-weight:900; font-size:12px; border:1px solid rgba(214,168,90,.34); color:#fff0d2!important; background:rgba(214,168,90,.12); box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.route-links .action { flex:1 1 142px; }
.stop { display:grid; grid-template-columns:38px 1fr; gap:12px; padding:14px; border-bottom:1px solid rgba(239,230,214,.08); }
.stop:last-child { border-bottom:0; }
.num { width:32px; height:32px; border-radius:999px; display:grid; place-items:center; color:#20150f; font-weight:950; font-size:13px; margin-top:1px; }
.stop b { display:block; font-size:15px; line-height:1.28; color:#fff7e8; }
.stop span { display:block; color:#bfb3a4; font-size:12px; line-height:1.45; margin-top:4px; }
.stop-actions { display:grid; grid-template-columns:1fr; gap:8px; margin-top:10px; }
.marker-num,.marker-hotel { display:grid; place-items:center; border-radius:999px; font-weight:950; border:3px solid #151210; box-shadow:0 8px 22px rgba(0,0,0,.48); }
.marker-num { width:32px; height:32px; color:#20150f; font-size:13px; }
.marker-hotel { width:40px; height:40px; color:#20150f; background:var(--gold); font-size:14px; }
.leaflet-container { font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif; background:#171717; }
.leaflet-popup-content { margin:15px; line-height:1.45; max-width:270px; color:#2b2118; }
.leaflet-popup-content-wrapper { border-radius:18px; background:#f4eadb; }
.popup b { font-size:14px; color:#2b2118; } .popup small { color:#756a5d; }
.popup .links { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
.popup .links a { min-height:42px; min-width:96px; display:inline-flex; justify-content:center; align-items:center; border-radius:12px; background:#2b2118; color:#fff!important; text-decoration:none; font-weight:900; padding:9px 11px; }
.leaflet-control-zoom { border:0!important; border-radius:16px!important; overflow:hidden; box-shadow:0 12px 32px rgba(0,0,0,.36)!important; background:rgba(21,18,16,.86)!important; backdrop-filter:blur(12px); }
.leaflet-control-zoom a { width:48px!important; height:48px!important; line-height:46px!important; font-size:25px!important; font-weight:900!important; background:rgba(31,26,21,.94)!important; color:#f8ead8!important; border:0!important; border-bottom:1px solid rgba(239,230,214,.14)!important; text-decoration:none!important; text-shadow:none!important; }
.leaflet-top.leaflet-left { top:66px; left:8px; }
@media (min-width:860px) {
  .shell { padding-left:34px; padding-right:34px; }
  .panel-head { padding:24px 26px; grid-template-columns:1fr auto; align-items:end; }
  .sub { text-align:right; max-width:460px; }
  .content { padding:20px; grid-template-columns:340px 1fr; align-items:start; }
  .overview-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .legs { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .days { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  #map { min-height:560px; }
}
@media (max-width:720px) { .tabs { grid-template-columns:repeat(3,minmax(0,1fr)); } .brand span { display:none; } h1 { font-size:36px; } #map { height:56vh; min-height:390px; } }
@media (max-width:390px) { .tab { font-size:11px; min-height:44px; } #map { min-height:360px; } }
</style>

const state = { active: 0, map: null, layers: null, routeLayer: null };
const $ = id => document.getElementById(id);
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function appleMaps(lat, lon, name) { return `https://maps.apple.com/?ll=${lat},${lon}&q=${encodeURIComponent(name)}`; }
function appleRoute(stops) { const a = stops[0], b = stops[stops.length - 1]; return `https://maps.apple.com/?saddr=${a.lat},${a.lon}&daddr=${b.lat},${b.lon}`; }
function icon(label, color, hotel=false) { const size = hotel ? 40 : 32, anchor = hotel ? 20 : 16; return L.divIcon({ className:'', html:`<div class="${hotel?'marker-hotel':'marker-num'}" style="background:${hotel?'var(--gold)':color}">${label}</div>`, iconSize:[size,size], iconAnchor:[anchor,anchor], popupAnchor:[0,-anchor] }); }
function initMap() {
  if (!window.L) return;
  state.map = L.map('map', { zoomControl:true, attributionControl:true, scrollWheelZoom:false, dragging:true, touchZoom:true, doubleClickZoom:true, boxZoom:false, keyboard:false, trackResize:true }).setView([29,108],5);
  const providers = [{ url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', subdomains:'abcd', attr:'&copy; OpenStreetMap &copy; CARTO' },{ url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', subdomains:'', attr:'Tiles &copy; Esri' }];
  let idx = 0, layer;
  function loadTiles(i) { if (layer) state.map.removeLayer(layer); const p = providers[i]; layer = L.tileLayer(p.url, { maxZoom:19, subdomains:p.subdomains, attribution:p.attr }).addTo(state.map); layer.on('tileerror', () => { if (idx === 0) { idx = 1; loadTiles(idx); } }); }
  loadTiles(0); state.layers = L.layerGroup().addTo(state.map); state.routeLayer = L.layerGroup().addTo(state.map);
  window.addEventListener('orientationchange', () => setTimeout(resizeMap, 450)); window.addEventListener('resize', () => setTimeout(resizeMap, 160));
}
function resizeMap() { if (state.map && $('map')?.offsetWidth) state.map.invalidateSize({ pan:false }); }
function renderTabs() { $('tabs').innerHTML = views.map((v,i)=>`<button class="tab" type="button" aria-selected="${i===state.active}" onclick="selectView(${i})">${esc(v.name)}</button>`).join(''); }
function renderView() {
  const view = views[state.active]; renderTabs();
  $('eyebrow').textContent = view.kind === 'overview' ? 'Complete trip overview' : 'City roadmap'; $('title').textContent = view.name; $('subtitle').textContent = view.subtitle;
  $('content').innerHTML = view.kind === 'overview' ? renderOverview(view) : renderCity(view);
  renderMap(view); setTimeout(resizeMap, 50); setTimeout(resizeMap, 700);
}
function renderOverview(view) {
  return `<div class="grid"><div class="overview-grid">${view.cards.map(c=>`<article class="overview-card"><div class="label">${esc(c.title)}</div><strong>${esc(c.body)}</strong></article>`).join('')}</div></div><div class="legs">${view.legs.map(l=>`<article class="leg-card"><div class="mode">${esc(l.mode)}</div><div><strong>${esc(l.label)}</strong><span>${esc(l.note)}</span></div></article>`).join('')}</div>`;
}
function renderCity(city) {
  const hotel = `<aside class="hotel"><div class="label">Pinned base</div><strong>${esc(city.hotel.name)}</strong><small>${esc(city.hotel.cn)} · ${esc(city.hotel.note)}</small><div class="stop-actions"><a class="action" href="${appleMaps(city.hotel.lat,city.hotel.lon,city.hotel.name)}" target="_blank" rel="noopener">Open in Apple Maps</a></div></aside>`;
  const days = `<div class="days">${city.days.map(day=>`<section class="day"><div class="day-head"><div class="day-title"><i class="swatch" style="background:${day.color}"></i>${esc(day.label)}</div></div><div class="route-links"><a class="action" href="${appleRoute(day.stops)}" target="_blank" rel="noopener">Open route in Apple Maps</a></div>${day.stops.map(s=>`<article class="stop"><div class="num" style="background:${day.color}">${s.n}</div><div><b>${esc(s.name)}</b><span>${esc(s.cn)} · ${esc(s.note)}</span><div class="stop-actions"><a class="action" href="${appleMaps(s.lat,s.lon,s.name)}" target="_blank" rel="noopener">Open in Apple Maps</a></div></div></article>`).join('')}</section>`).join('')}</div>`;
  return hotel + days;
}
function popupHtml(item) { return `<div class="popup"><b>${esc(item.name)}</b><br><small>${esc(item.cn || '')}</small><br>${esc(item.note || '')}<div class="links"><a href="${appleMaps(item.lat,item.lon,item.name)}" target="_blank" rel="noopener">Apple Maps</a></div></div>`; }
function renderMap(view) {
  if (!state.map) return; state.layers.clearLayers(); state.routeLayer.clearLayers(); const bounds = [];
  if (view.kind === 'overview') {
    const byN = Object.fromEntries(view.points.map(p => [p.n,p]));
    view.legs.forEach((leg, idx) => { const a = byN[leg.from], b = byN[leg.to]; if (!a || !b) return; L.polyline([[a.lat,a.lon],[b.lat,b.lon]], { color: idx > 6 ? '#8EA4B8' : '#C96F42', weight:3, opacity:.78, dashArray: leg.mode.includes('Flight') ? '8 10' : '3 8' }).bindPopup(`<b>${esc(leg.label)}</b><br>${esc(leg.note)}`).addTo(state.routeLayer); });
    view.points.forEach(p => { bounds.push([p.lat,p.lon]); L.marker([p.lat,p.lon], {icon:icon(p.n,'#D6A85A')}).bindPopup(popupHtml(p)).addTo(state.layers); });
  } else {
    const h = view.hotel; bounds.push([h.lat,h.lon]); L.marker([h.lat,h.lon], {icon:icon('H','var(--gold)',true)}).bindPopup(popupHtml(h)).addTo(state.layers);
    view.days.forEach(day => day.stops.forEach(s => { bounds.push([s.lat,s.lon]); L.marker([s.lat,s.lon], {icon:icon(s.n,day.color)}).bindPopup(popupHtml(s)).addTo(state.layers); }));
  }
  setTimeout(() => { resizeMap(); if (bounds.length) state.map.fitBounds(bounds, { padding:[30,30], maxZoom:view.kind==='overview'?7:15 }); }, 100);
  setTimeout(() => { resizeMap(); if (bounds.length) state.map.fitBounds(bounds, { padding:[30,30], maxZoom:view.kind==='overview'?7:15 }); }, 650);
}
function selectView(i) { state.active = i; renderView(); requestAnimationFrame(() => $('map').scrollIntoView({ behavior:'smooth', block:'nearest' })); }
function init() { renderTabs(); initMap(); renderView(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
